[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halt-monitor"
version = "0.1.0"
description = "Health Analysis of Layers during Training: early detection of silent training failures in neural networks"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]